syntax = "proto3";

package limani.v1;

import "google/protobuf/empty.proto";
import "limani/v1/calendar.proto";
import "limani/v1/calendar_api.proto";
import "limani/v1/todo.proto";
import "limani/v1/todo_api.proto";
import "limani/v1/todo_comment.proto";
import "limani/v1/todo_comment_api.proto";
import "limani/v1/todo_link.proto";
import "limani/v1/todo_link_api.proto";

// CalendarService はカレンダー（タスクリスト）の API。
// 認証は kebab のアクセストークン（Authorization: Bearer）。
service CalendarService {
  // 呼び出し元がメンバーであるカレンダーを一覧する。
  rpc ListCalendars(ListCalendarsRequest) returns (ListCalendarsResponse);
  rpc GetCalendar(GetCalendarRequest) returns (Calendar);
  rpc CreateCalendar(CreateCalendarRequest) returns (Calendar);
}

// TodoService は Todo（VTODO）の API。
// 認証は kebab のアクセストークン（Authorization: Bearer）。
service TodoService {
  // カレンダーに出ている Todo を一覧する（TodoLink で同期されている Todo を含む）。
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);
  rpc GetTodo(GetTodoRequest) returns (Todo);
  rpc CreateTodo(CreateTodoRequest) returns (Todo);
  rpc UpdateTodo(UpdateTodoRequest) returns (Todo);
  rpc SetTodoStatus(SetTodoStatusRequest) returns (Todo);
  // Todo を削除する。Todo が出ているすべてのカレンダーから消える（どのカレンダーのリソース名で呼んでも同じ）。
  // 1 つのカレンダーから外すだけのときは DeleteTodoLink を使う。
  rpc DeleteTodo(DeleteTodoRequest) returns (google.protobuf.Empty);
  // Todo が出ているカレンダーを一覧する。
  rpc ListTodoLinks(ListTodoLinksRequest) returns (ListTodoLinksResponse);
  // Todo をほかのカレンダーにもリンクする（イベント間の同期）。
  rpc CreateTodoLink(CreateTodoLinkRequest) returns (TodoLink);
  // Todo をカレンダーから外す（そのカレンダーとの同期をやめる）。最後の 1 つのカレンダーからは外せない。
  rpc DeleteTodoLink(DeleteTodoLinkRequest) returns (google.protobuf.Empty);
  // Todo のコメントを古い順に一覧する。コメントは Todo が出ているすべてのカレンダーで共有され、iCalendar・CalDAV には出ない。
  rpc ListTodoComments(ListTodoCommentsRequest) returns (ListTodoCommentsResponse);
  // Todo にコメントを書く。Todo の etag・sequence・update_time は変わらない。
  rpc CreateTodoComment(CreateTodoCommentRequest) returns (TodoComment);
  // コメントの本文を直す。書いた人だけができる。
  rpc UpdateTodoComment(UpdateTodoCommentRequest) returns (TodoComment);
  // コメントを削除する。書いた人だけができる。
  rpc DeleteTodoComment(DeleteTodoCommentRequest) returns (google.protobuf.Empty);
}
