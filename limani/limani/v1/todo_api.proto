syntax = "proto3";

package limani.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "limani/v1/todo.proto";

// ListTodosRequest はカレンダー内の Todo を一覧する。
// TodoLink で同期されている Todo も含めて返す。
message ListTodosRequest {
  // 親（calendars/{id}）。
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // 指定した status の Todo だけを返す。空なら絞り込まない。
  repeated TodoStatus statuses = 2 [(google.api.field_behavior) = OPTIONAL];
  int32 page_size = 3;
  string page_token = 4;
  // 指定した iCalendar の UID の Todo だけを返す（0件か1件）。空なら絞り込まない。
  string uid = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListTodosResponse {
  repeated Todo todos = 1;
  string next_page_token = 2;
}

// GetTodoRequest は Todo を取得する。
message GetTodoRequest {
  // リソース名（calendars/{calendar}/todos/{todo}）。
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// CreateTodoRequest は Todo を作る。
message CreateTodoRequest {
  // 親（calendars/{id}）。
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // 作る Todo。summary は必須。uid が空ならサーバーが決める。
  // name・sequence・etag・ics・create_time・update_time は無視する。
  Todo todo = 2 [(google.api.field_behavior) = REQUIRED];
}

// UpdateTodoRequest は Todo を更新する。
//
// todo.etag を指定すると、保存されている etag と違うときに ABORTED を返す。
// 空なら競合を検出しない。
message UpdateTodoRequest {
  // 更新する Todo。name で対象を決める。Todo が出ているカレンダーのどの name でもよく、
  // どのカレンダーから更新しても、Todo が出ているすべてのカレンダーに反映される。
  Todo todo = 1 [(google.api.field_behavior) = REQUIRED];
  // 更新するフィールド。次のどれか:
  // summary, description, status, priority, percent_complete,
  // dtstart, due, completed_time, categories, parent_uid, assignees, completed_assignees。
  //
  // completed_assignees は、担当者ごとの完了を直接書く。書き込み権限があれば、誰の分でも書ける
  // （assignees にない人を含めると INVALID_ARGUMENT。同じリクエストで assignees も変えるなら、変えたあとの assignees で確かめる）。
  // 書いた結果、担当者の全員の分が完了になれば、Todo の status は COMPLETED になる
  // （completed_time を入れ、percent_complete を 100 にする）。完了していない人が残っていれば、
  // COMPLETED だった Todo は IN_PROCESS に戻り（completed_time を消す）、NEEDS_ACTION だった Todo は IN_PROCESS になる。
  // status と同時に指定したときは、status の意味（「完了にする操作の行為者」の規則）より completed_assignees を優先する。
  //
  // status を COMPLETED にしたときの意味は、SetTodoStatus の「担当者ごとの完了」を参照。
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// SetTodoStatusRequest は status だけを変える近道。
//
// COMPLETED にすると completed_time に現在時刻を入れ、percent_complete を 100 にする。
// COMPLETED から戻すと completed_time を消す。
//
// 担当者ごとの完了: Todo.assignees が 2 人以上いるとき、呼び出した人（行為者）によって意味が変わる。
// UpdateTodo の status、状態つきの CreateTodoComment、RedeemTodoCompletionTicket（行為者は発行者）、CalDAV の PUT も同じ規則になる。
//
// 1. COMPLETED にする:
//    - 担当者がいない: Todo を COMPLETED にする。
//    - 行為者が担当者の一人: 行為者の分だけを完了にする（completed_assignees に入れる）。全員の分がそろえば Todo を
//      COMPLETED にする（上の completed_time と percent_complete）。そろわなければ status は COMPLETED にならず、
//      NEEDS_ACTION なら IN_PROCESS になる（応答の status は IN_PROCESS）。
//    - 行為者が担当者でない: 管理者の操作とみなし、全員の分を完了にして Todo を COMPLETED にする。
// 2. COMPLETED から戻す:
//    - 行為者が担当者の一人: 行為者の分だけを未完了に戻す。ほかの人の分は完了のまま。
//    - 行為者が担当者でない: 全員の分を未完了に戻す。
//
// 担当者が 1 人だけの Todo は、その人の分の完了が Todo の完了になる（従来と同じ）。
message SetTodoStatusRequest {
  // リソース名（calendars/{calendar}/todos/{todo}）。
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  TodoStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  // 指定すると、保存されている etag と違うときに ABORTED を返す。
  string etag = 3 [(google.api.field_behavior) = OPTIONAL];
}

// DeleteTodoRequest は Todo を削除する。削除の記録（tombstone）を残す。
//
// Todo が出ているすべてのカレンダーから消える（どのカレンダーのリソース名で指定しても同じ。
// 呼び出し元がそのカレンダーの書き込み権限を持つメンバーである必要がある）。
// 1 つのカレンダーから外すだけのときは DeleteTodoLink を使う。
message DeleteTodoRequest {
  // リソース名（calendars/{calendar}/todos/{todo}）。
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // 指定すると、保存されている etag と違うときに ABORTED を返す。
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}
