syntax = "proto3";

package limani.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// TodoStatus は VTODO の STATUS（RFC 5545 3.8.1.11）。
enum TodoStatus {
  TODO_STATUS_UNSPECIFIED = 0;
  // NEEDS-ACTION
  TODO_STATUS_NEEDS_ACTION = 1;
  // IN-PROCESS
  TODO_STATUS_IN_PROCESS = 2;
  // COMPLETED
  TODO_STATUS_COMPLETED = 3;
  // CANCELLED
  TODO_STATUS_CANCELLED = 4;
}

// TodoAssigneeRole は、担当者（Todo.assignees）の役割（RACI）。
// ics では、担当者の ATTENDEE の ROLE パラメーター（RFC 5545 3.2.16）に出る。
// 担当者は複数の役割を持てる（例: R と A を同じ人が兼ねる）。
enum TodoAssigneeRole {
  TODO_ASSIGNEE_ROLE_UNSPECIFIED = 0;
  // R（Responsible: 実行責任者）。ATTENDEE の ROLE=REQ-PARTICIPANT。1 つの Todo に何人いてもよい。
  // 担当者を足すときの既定。
  TODO_ASSIGNEE_ROLE_RESPONSIBLE = 1;
  // A（Accountable: 説明責任者）。ATTENDEE の ROLE=CHAIR。1 つの Todo につき 1 人まで（2 人以上にすると INVALID_ARGUMENT）。
  // A のいない Todo もある（この機能より前に作った Todo や、CalDAV で作った Todo）。
  TODO_ASSIGNEE_ROLE_ACCOUNTABLE = 2;
  // C（Consulted: 相談先）。ATTENDEE の ROLE=OPT-PARTICIPANT。
  TODO_ASSIGNEE_ROLE_CONSULTED = 3;
  // I（Informed: 報告先）。ATTENDEE の ROLE=NON-PARTICIPANT。
  TODO_ASSIGNEE_ROLE_INFORMED = 4;
}

// TodoDateTime は DTSTART・DUE の値。日付（VALUE=DATE）と日時（VALUE=DATE-TIME）を区別する。
message TodoDateTime {
  // all_day が false なら、その瞬間。
  // all_day が true なら、日付を UTC の 00:00:00 で表した値（例: 2026-11-03 は 2026-11-03T00:00:00Z）。
  google.protobuf.Timestamp time = 1;
  // true なら日付のみ（VALUE=DATE）。tzid は使わない。
  bool all_day = 2;
  // IANA のタイムゾーン名（例: Asia/Tokyo）。ics に TZID として出す。
  // 空なら UTC（末尾が Z の日時）。all_day のときは無視する。
  string tzid = 3;
}

// TodoAssigneeRoles は、担当者 1 人の役割（RACI）。
message TodoAssigneeRoles {
  // 担当者の kebab のユーザー ID（Todo.assignees の 1 人）。
  string user = 1 [(google.api.field_behavior) = REQUIRED];
  // その人の役割。1 つ以上で、重複しない。UNSPECIFIED は指定できない（INVALID_ARGUMENT）。
  // 複数あるときは R、A、C、I の順に返す。
  repeated TodoAssigneeRole roles = 2 [(google.api.field_behavior) = REQUIRED];
}

// TodoApp は、Todo を作った・更新した外部アプリ（外部アプリ連携。kebab のユーザーではない）。
// 外部アプリ連携の Webhook（calendars/{calendar}/federatedWebhooks/{federated_webhook}）に届いた JSON から作った Todo の、作った人・更新した人として返す。
// 連携を削除しても、その連携が作った Todo には名前が残る（display_name は削除の時点のもの）。
message TodoApp {
  // 連携のリソース名（calendars/{calendar}/federatedWebhooks/{federated_webhook}）。
  // {calendar} は連携を登録したカレンダーで、問い合わせたカレンダーとは限らない（Todo が複数のカレンダーに出ているとき）。
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // アプリの名前（連携を登録したときの表示名）。
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Todo は VTODO 1件。
message Todo {
  // リソース名（calendars/{calendar}/todos/{todo}）。{todo} はサーバーが決める ID で、UID とは別。
  // UID は任意の文字列（URL や「/」を含むこともある）なので、リソース名には使わない。
  // {calendar} には、Todo が出ているカレンダー（TodoLink）のどれでも指定できる。
  // 返す name は、問い合わせたカレンダーのもの（同じ Todo でも、カレンダーごとに name が違う）。
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // iCalendar の UID。カレンダー内で一意（リンクされた Todo を含む）。作成時に省略するとサーバーが決める。
  // UID から Todo を探すときは ListTodos の uid で絞り込む。
  string uid = 2 [(google.api.field_behavior) = IMMUTABLE];
  // SUMMARY。必須。
  string summary = 3 [(google.api.field_behavior) = REQUIRED];
  // DESCRIPTION。
  string description = 4;
  // STATUS。作成時に未指定なら NEEDS-ACTION。
  TodoStatus status = 5;
  // PRIORITY（0〜9。0 は未設定、1 が最も高い）。
  int32 priority = 6;
  // PERCENT-COMPLETE（0〜100）。
  int32 percent_complete = 7;
  // DTSTART。未設定なら省略。
  TodoDateTime dtstart = 8;
  // DUE。未設定なら省略。dtstart より前にできず、dtstart と all_day をそろえる。
  TodoDateTime due = 9;
  // COMPLETED。status が COMPLETED になると、未指定ならサーバーが現在時刻を入れる。
  google.protobuf.Timestamp completed_time = 10;
  // CATEGORIES。
  repeated string categories = 11;
  // 親の Todo の UID（RELATED-TO;RELTYPE=PARENT）。
  // 親は、書き込みに使ったカレンダーの中で UID から探す（Todo が出ているカレンダーごとに、親の Todo が出ているとは限らない。
  // 親がそのカレンダーに出ていなければ、そのカレンダーからは親が見つからない）。
  string parent_uid = 12;
  // 担当者の kebab のユーザー ID（ATTENDEE として ics に出る）。
  // 返すのは、Todo が出ているすべてのカレンダーのメンバーのうち、いまメンバーである人だけ。
  // 書き込み権限のない（閲覧のみの）メンバーも、UpdateTodo の update_mask に assignees だけを指定して、自分自身を担当者に足す・外すことはできる
  // （ほかの人を足したり外したりすると PERMISSION_DENIED。UpdateTodoRequest の「閲覧のみのメンバーの自己申告」を参照）。
  repeated string assignees = 13;
  // SEQUENCE。更新のたびに増える。
  int32 sequence = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 楽観的排他制御のための値。CalDAV の ETag と同じ。
  // UpdateTodo で指定すると、保存されている値と違うときに ABORTED を返す。
  string etag = 15 [(google.api.field_behavior) = OPTIONAL];
  // VCALENDAR 全文（RFC 5545）。
  string ics = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 作成時刻。
  google.protobuf.Timestamp create_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // LAST-MODIFIED。
  google.protobuf.Timestamp update_time = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // この Todo が出ているカレンダー（calendars/{id}）。1 つ以上ある。カレンダーの ID の昇順。
  // どのカレンダーで作った Todo かによる違いはない（Todo の同期は TodoLink で増減する）。
  repeated string calendars = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 作った人の kebab のユーザー ID（TodoComment.author と同じ形式）。
  // CalDAV で作った Todo は、アプリパスワードの持ち主。作った人がカレンダーのメンバーから外れていても返る。
  // 表示名・アイコンは返さない。kebab の GetUser で引くこと。
  // 外部アプリ連携で作った Todo は空で、代わりに creator_app を返す。
  string creator = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 最後に更新した人の kebab のユーザー ID（creator と同じ形式）。
  // UpdateTodo・SetTodoStatus・状態つきの CreateTodoComment・CalDAV の PUT で、中身（summary・description・status・priority・
  // percent_complete・dtstart・due・completed_time・categories・parent_uid・assignees・completed_assignees・assignee_roles）が実際に変わったときだけ更新する
  // （DTSTAMP・SEQUENCE だけが変わる再送では変わらない）。一度も更新されていなければ creator と同じ。
  // TodoChangeHistory の actor と対応する。
  // 外部アプリ連携が最後に更新した（作ったまま更新されていない）ときは空で、代わりに last_updater_app を返す。
  string last_updater = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 自分の分を完了にした担当者の kebab のユーザー ID（assignees の部分集合）。
  // 担当者ごとの完了は、担当者それぞれの作業が終わったかを表す。assignees が 2 人以上いるとき、全員の分が完了になるまで
  // status は COMPLETED にならない（全員の分がそろった時点で COMPLETED になる）。
  // 担当者の分が完了なのは、その人が自分の分を完了にしたとき、または status が COMPLETED のとき
  // （COMPLETED の Todo では assignees の全員が入る）。
  // assignees が 1 人以下のときは status に一致する（1 人なら、その人の分の完了 = Todo の完了）。
  // 担当者ごとの完了を持つのは、assignee_roles で R（実行責任者）を持つ人だけ。
  // A（説明責任者）・C（相談先）・I（報告先）だけの人（R を兼ねない人）は、自分の分の完了を持たない: completed_assignees に入らず（COMPLETED の Todo でも入らない）、
  // 全員の分がそろったかの判定にも数えない。R の担当者が 1 人もいない Todo（担当者なし、または全員が A・C・I だけ）は、
  // 担当者ごとの完了を持たず、Todo の完了がそのまま完了になる。
  // A・C・I だけの人が完了にする操作（SetTodoStatus など）をすると、担当者でない人の操作として扱う（SetTodoStatus の「担当者ごとの完了」を参照）。
  // UpdateTodo の update_mask に completed_assignees を指定すると書ける（assignees にない人、A・C・I だけの人を含めると INVALID_ARGUMENT）。
  // 書き込み権限のない（閲覧のみの）メンバーも、自分が担当者なら、自分の分だけは完了にする・取り消すことができる（UpdateTodoRequest を参照）。
  repeated string completed_assignees = 22;
  // 作ったのが外部アプリ連携のときの、そのアプリ。このとき creator は空。kebab のユーザーが作ったときは未設定。
  TodoApp creator_app = 23 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 最後に更新したのが外部アプリ連携のとき（一度も更新されていなければ作ったアプリ）の、そのアプリ。このとき last_updater は空。
  // kebab のユーザーが最後に更新したときは未設定。
  TodoApp last_updater_app = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 担当者ごとの役割（RACI）。assignees の全員について 1 件ずつ、assignees と同じ順で返す。
  // ics では、担当者の ATTENDEE の ROLE パラメーター（R は REQ-PARTICIPANT、A は CHAIR、C は OPT-PARTICIPANT、I は NON-PARTICIPANT）に出る。
  // 1 人が複数の役割を持つときは、ROLE には R、A、C、I の順で先に当てはまるものを 1 つだけ出し（A と R を兼ねる人は REQ-PARTICIPANT）、
  // 全部の役割は x-param の X-LIMANI-RACI（例: X-LIMANI-RACI=R,A）に出す。1 つの役割だけの人は ROLE だけを出す。
  // CalDAV クライアントが ROLE を書き換えたときは、X-LIMANI-RACI より ROLE を優先して読む。
  // ROLE のない担当者（この機能より前に作った Todo、CalDAV で作った Todo）や、知らない ROLE の値は R として返す。
  // A は 1 つの Todo につき 1 人まで。
  //
  // 書くには、CreateTodo の todo.assignee_roles、または UpdateTodo の update_mask に assignee_roles を指定する。Todo の書き込み権限が要る
  // （書き込み権限のない（閲覧のみの）メンバーは、自分を担当者に足す（このとき役割は R になる）ことはできるが、役割を変えることはできない。
  // update_mask に assignee_roles を含めると PERMISSION_DENIED）。
  //   - 指定するのは役割を決めたい担当者だけでよい。指定しなかった担当者は今の役割のまま。assignees も同時に変えるなら、変えたあとの assignees で確かめる。
  //   - assignees にいない人を含める、roles が空、UNSPECIFIED を含める、同じ人を 2 件以上指定する、
  //     書いた結果 A が 2 人以上になる、のどれかなら INVALID_ARGUMENT。
  //   - assignees に足した人で assignee_roles に指定しなかった人は R になる。
  //   - 担当者を外すと、その人の役割も消える。
  // 担当者ごとの完了（completed_assignees）には、R を持つ人だけが入る（completed_assignees を参照）。
  repeated TodoAssigneeRoles assignee_roles = 25;
}
