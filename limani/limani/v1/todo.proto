syntax = "proto3";

package limani.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// TodoStatus は VTODO の STATUS（RFC 5545 3.8.1.11）。
enum TodoStatus {
  TODO_STATUS_UNSPECIFIED = 0;
  // NEEDS-ACTION
  TODO_STATUS_NEEDS_ACTION = 1;
  // IN-PROCESS
  TODO_STATUS_IN_PROCESS = 2;
  // COMPLETED
  TODO_STATUS_COMPLETED = 3;
  // CANCELLED
  TODO_STATUS_CANCELLED = 4;
}

// TodoDateTime は DTSTART・DUE の値。日付（VALUE=DATE）と日時（VALUE=DATE-TIME）を区別する。
message TodoDateTime {
  // all_day が false なら、その瞬間。
  // all_day が true なら、日付を UTC の 00:00:00 で表した値（例: 2026-11-03 は 2026-11-03T00:00:00Z）。
  google.protobuf.Timestamp time = 1;
  // true なら日付のみ（VALUE=DATE）。tzid は使わない。
  bool all_day = 2;
  // IANA のタイムゾーン名（例: Asia/Tokyo）。ics に TZID として出す。
  // 空なら UTC（末尾が Z の日時）。all_day のときは無視する。
  string tzid = 3;
}

// Todo は VTODO 1件。
message Todo {
  // リソース名（calendars/{calendar}/todos/{todo}）。{todo} はサーバーが決める ID で、UID とは別。
  // UID は任意の文字列（URL や「/」を含むこともある）なので、リソース名には使わない。
  // {calendar} には、Todo が出ているカレンダー（TodoLink）のどれでも指定できる。
  // 返す name は、問い合わせたカレンダーのもの（同じ Todo でも、カレンダーごとに name が違う）。
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // iCalendar の UID。カレンダー内で一意（リンクされた Todo を含む）。作成時に省略するとサーバーが決める。
  // UID から Todo を探すときは ListTodos の uid で絞り込む。
  string uid = 2 [(google.api.field_behavior) = IMMUTABLE];
  // SUMMARY。必須。
  string summary = 3 [(google.api.field_behavior) = REQUIRED];
  // DESCRIPTION。
  string description = 4;
  // STATUS。作成時に未指定なら NEEDS-ACTION。
  TodoStatus status = 5;
  // PRIORITY（0〜9。0 は未設定、1 が最も高い）。
  int32 priority = 6;
  // PERCENT-COMPLETE（0〜100）。
  int32 percent_complete = 7;
  // DTSTART。未設定なら省略。
  TodoDateTime dtstart = 8;
  // DUE。未設定なら省略。dtstart より前にできず、dtstart と all_day をそろえる。
  TodoDateTime due = 9;
  // COMPLETED。status が COMPLETED になると、未指定ならサーバーが現在時刻を入れる。
  google.protobuf.Timestamp completed_time = 10;
  // CATEGORIES。
  repeated string categories = 11;
  // 親の Todo の UID（RELATED-TO;RELTYPE=PARENT）。
  // 親は、書き込みに使ったカレンダーの中で UID から探す（Todo が出ているカレンダーごとに、親の Todo が出ているとは限らない。
  // 親がそのカレンダーに出ていなければ、そのカレンダーからは親が見つからない）。
  string parent_uid = 12;
  // 担当者の kebab のユーザー ID（ATTENDEE として ics に出る）。
  // 返すのは、Todo が出ているすべてのカレンダーのメンバーのうち、いまメンバーである人だけ。
  repeated string assignees = 13;
  // SEQUENCE。更新のたびに増える。
  int32 sequence = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 楽観的排他制御のための値。CalDAV の ETag と同じ。
  // UpdateTodo で指定すると、保存されている値と違うときに ABORTED を返す。
  string etag = 15 [(google.api.field_behavior) = OPTIONAL];
  // VCALENDAR 全文（RFC 5545）。
  string ics = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 作成時刻。
  google.protobuf.Timestamp create_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // LAST-MODIFIED。
  google.protobuf.Timestamp update_time = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // この Todo が出ているカレンダー（calendars/{id}）。1 つ以上ある。カレンダーの ID の昇順。
  // どのカレンダーで作った Todo かによる違いはない（Todo の同期は TodoLink で増減する）。
  repeated string calendars = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 作った人の kebab のユーザー ID（TodoComment.author と同じ形式）。
  // CalDAV で作った Todo は、アプリパスワードの持ち主。作った人がカレンダーのメンバーから外れていても返る。
  // 表示名・アイコンは返さない。kebab の GetUser で引くこと。
  string creator = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 最後に更新した人の kebab のユーザー ID（creator と同じ形式）。
  // UpdateTodo・SetTodoStatus・状態つきの CreateTodoComment・CalDAV の PUT で、中身（summary・description・status・priority・
  // percent_complete・dtstart・due・completed_time・categories・parent_uid・assignees・completed_assignees）が実際に変わったときだけ更新する
  // （DTSTAMP・SEQUENCE だけが変わる再送では変わらない）。一度も更新されていなければ creator と同じ。
  // TodoChangeHistory の actor と対応する。
  string last_updater = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 自分の分を完了にした担当者の kebab のユーザー ID（assignees の部分集合）。
  // 担当者ごとの完了は、担当者それぞれの作業が終わったかを表す。assignees が 2 人以上いるとき、全員の分が完了になるまで
  // status は COMPLETED にならない（全員の分がそろった時点で COMPLETED になる）。
  // 担当者の分が完了なのは、その人が自分の分を完了にしたとき、または status が COMPLETED のとき
  // （COMPLETED の Todo では assignees の全員が入る）。
  // assignees が 1 人以下のときは status に一致する（1 人なら、その人の分の完了 = Todo の完了）。
  // UpdateTodo の update_mask に completed_assignees を指定すると書ける（assignees にない人を含めると INVALID_ARGUMENT）。
  repeated string completed_assignees = 22;
}
