syntax = "proto3";

package limani.v1;

import "google/api/field_behavior.proto";
import "limani/v1/calendar.proto";

// ListCalendarsRequest は呼び出し元がメンバーであるカレンダーを一覧する。
//
// メンバーかどうかは vitrina の RoleAssignment で決まる。
// 準備会のカレンダーは、その準備会に何らかのロールを持つ人がメンバー。
// イベントのカレンダーは、そのイベント、またはイベントを主催する準備会に
// 何らかのロールを持つ人がメンバー。
message ListCalendarsRequest {
  // 絞り込み先の vitrina のリソース名（organizations/{id} または events/{id}）。
  // 空なら絞り込まない。
  string parent = 1 [(google.api.field_behavior) = OPTIONAL];
  int32 page_size = 2;
  string page_token = 3;
}

message ListCalendarsResponse {
  repeated Calendar calendars = 1;
  string next_page_token = 2;
}

// GetCalendarRequest はカレンダーを取得する。
// メンバーでない場合は NotFound を返す（存在を漏らさないため）。
message GetCalendarRequest {
  // リソース名（calendars/{id}）。
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// CreateCalendarRequest はカレンダーを作る。呼び出し元が parent のメンバーである必要がある。
message CreateCalendarRequest {
  // 親（organizations/{id} または events/{id}）。vitrina のリソース名。
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // 作るカレンダー。display_name は必須。name・scope・sync_token は無視する。
  Calendar calendar = 2 [(google.api.field_behavior) = REQUIRED];
}
