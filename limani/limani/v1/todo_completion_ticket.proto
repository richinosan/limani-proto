syntax = "proto3";

package limani.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// TodoCompletionTicket は、あとで Todo を完了報告つきで完了にするための引換券（完了チケット）。
//
// pompe の予約投稿のように、利用者の kebab のトークンを持たない無人の処理から Todo を完了にするために使う。
// 利用者がいるうち（投稿を保存したときなど）に、利用者のトークンで CreateTodoCompletionTicket を呼んで発行しておき、
// あとで処理が終わったときに secret を RedeemTodoCompletionTicket に渡して引き換える。
//
// 引き換えると、Todo を COMPLETED にし、発行した人を書いた人として完了報告（status_change が COMPLETED のコメント）を書く。
// 1 枚のチケットで書ける完了報告は 1 件だけ。同じ Todo に何枚でも発行でき、それぞれが別の完了報告になる。
// チケットは iCalendar・CalDAV には出ない。
message TodoCompletionTicket {
  // リソース名（calendars/{calendar}/todos/{todo}/completionTickets/{ticket}）。{ticket} はサーバーが決める ID。
  // {calendar} は、発行したときに指定したカレンダー。
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // 引き換えに使う秘密の文字列。CreateTodoCompletionTicket の応答にだけ入る（サーバーはハッシュだけを保存する）。
  // 持っている人は誰でも引き換えられるので、パスワードと同じく扱うこと。
  string secret = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 発行した人の kebab のユーザー ID。引き換えたときの完了報告は、この人が書いたことになる。
  string issuer = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 発行した時刻。
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 有効期限。発行から 400 日。過ぎると引き換えられない。
  google.protobuf.Timestamp expire_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}
